[project]
name = "el-core"
version = "0.1.0"
description = "Paths and settings for Economic Lab"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el_core"]
