[project]
name = "el-lab"
version = "0.1.0"
description = "CLI, registry, and scaffolds"
requires-python = ">=3.11"
dependencies = [
    "el-core",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
el = "el_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/el_lab"]

[tool.uv.sources]
el-core = { workspace = true }
